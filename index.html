<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boda de Eugenio &amp; Esther</title>
<meta name="description" content="Invitación a la boda de Eugenio &amp; Esther — 03 de Julio de 2027">

<!-- Preconnect para fuentes: arrancan a resolver DNS/TLS en paralelo -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Preload de la imagen de fondo del hero: es lo primero que ve el invitado -->
<link rel="preload" as="image" href="/images/prueba_HeroBG.jpg">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Infant:ital,wght@0,400;0,500;0,600;1,400&family=Quattrocento:wght@400;700&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/public/favicon/favicon-32x32.png">

<style>
  :root {
    --gold: #d5b15e;
    --gold-soft: #e0c179;
    --gold-deep: #b4933f;
    --ink: #4a4641;
    --ink-soft: #6e6862;
    --cream: #f6f1e9;
    --cream-deep: #efe7d6;
    --card: #ececec;
    --card-soft: #ececec6e;
    --card-deep: #e2e2e2;
    --paper: #faf5ec;
    --white: #ffffff;
    --shadow-card: 0 1px 2px rgba(40, 30, 10, 0.04), 0 6px 18px rgba(60, 45, 15, 0.05);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Quattrocento", "Cormorant Garamond", serif;
    color: var(--ink);
    background: #e6e1d8;
    line-height: 1.55;
    font-size: 15px;
  }

  /* ====== Parallax de capas — controlado por JS en cada frame de scroll ======
     El estado (transform/opacity/box-shadow) de .pxy, .event-card y .fiesta-card
     lo fija por completo startScrollReveal() en app.js, frame a frame, para que
     cada sección suba físicamente y tape a la anterior. El estado inicial aquí
     es solo el "primer pintado" antes de que JS calcule la posición real. */
  section.pxy, .event-card, .fiesta-card {
    opacity: 0;
    will-change: transform, opacity, box-shadow;
  }
  section.pxy { position: relative; }

  @media (prefers-reduced-motion: reduce) {
    section.pxy, .event-card, .fiesta-card {
      opacity: 1 !important;
      transform: none !important;
      box-shadow: none !important;
    }
  }

  .stage {
    min-height: 100vh;
    background: linear-gradient(180deg, #e6e1d8 0%, #ddd6c9 100%);
    padding: 28px 0;
    display: flex;
    justify-content: center;
  }
  .invite {
    width: 440px;
    max-width: calc(100vw - 16px);
    background: var(--white);
    box-shadow: 0 20px 60px rgba(60, 45, 20, 0.18), 0 4px 12px rgba(60, 45, 20, 0.08);
    overflow: hidden;
    position: relative;
    transform: translateZ(0);
  }

  section.block {
    position: relative;
    padding: 32px 36px 36px;
    text-align: center;
    background: var(--white);
  }
  section.block.cream { background: var(--paper); }

  .wave { display: block; width: 100%; height: 14px; }
  .wave svg { display: block; width: 100%; height: 100%; }

  .top-ornament { width: 110px; height: 70px; margin: 0 auto 18px; display: block; opacity: 0.95; }
  /* Transición en degradado (no línea recta) entre hero y la sección siguiente */
  .section-divider-fade {
    position: relative;
    padding: 26px 0 22px;
    background: linear-gradient(180deg, rgba(250,245,236,0) 0%, rgba(250,245,236,0.55) 45%, var(--white) 100%);
  }
  .top-ornament-lg { width: 130px; height: 88px; margin: 0 auto 26px; display: block; }

  /* ====== Hero ====== */
  .hero { position: relative; height: 100vh; }
  .hero-pin {
    background:
      radial-gradient(circle at 20% 12%, rgba(213, 177, 94, 0.10), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(213, 177, 94, 0.08), transparent 45%),
      var(--paper);
    padding: calc(20px + var(--safe-top)) 36px 0px;
    text-align: center;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100vh;
    z-index: -1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .hero-names, .hero-date, .hero-sub, .quote, .block {
    opacity: 0;
    animation: heroReveal 1s ease forwards;
  }
  .hero-date { animation-delay: .2s; }
  .hero-names { animation-delay: .4s; }
  .hero-sub { animation-delay: .6s; }
  .quote { animation-delay: .8s; }
  .block { animation-delay: 1s; }

  @keyframes heroReveal {
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-bg {
    position: absolute !important;
    inset: -120px 0 0 0;
    z-index: 0;
    background-image:
      linear-gradient(rgb(250 245 236 / 82%), rgb(250 245 236 / 79%)),
      url(/public/images/prueba_HeroBG.jpg);
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    will-change: transform;
    pointer-events: none;
  }

  .hero-pin::before {
    content: "";
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.82  0 0 0 0 0.68  0 0 0 0 0.36  0 0 0 0.10 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.55;
    pointer-events: none;
    mix-blend-mode: multiply;
  }
  .hero-pin > * { position: relative; z-index: 1; }

  .music-toggle {
    position: fixed;
    top: calc(18px + var(--safe-top)); right: 18px;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(74, 70, 65, 0.55);
    border: none;
    color: #fff;
    display: grid; place-items: center;
    cursor: pointer;
    z-index: 50;
    transition: background 0.2s ease;
  }
  .music-toggle:hover { background: rgba(74, 70, 65, 0.78); }
  .music-toggle svg { width: 26px; height: 26px; }
  .music-toggle.playing { background: var(--gold); }

  .hero-top-ornament { display: block; margin: 6px auto 60px; width: 220px; height: 70px; }

  .hero-date {
    display: flex; align-items: center; justify-content: center;
    gap: 14px;
    margin-bottom: 6px;
    font-family: "Karla", sans-serif;
    font-size: 30px;
    letter-spacing: 0.18em;
    color: var(--gold-deep);
    text-transform: uppercase;
  }
  .hero-date svg { width: 36px; height: 12px; }

  .hero-names {
    font-family: "Cormorant Infant", "Cormorant Garamond", serif;
    font-weight: 500;
    font-size: 44px;
    line-height: 1.05;
    color: var(--ink);
    margin: 6px 0 0;
    letter-spacing: 0.005em;
  }
  .amp {
    display: inline-grid; place-items: center;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--gold);
    color: #fff;
    font-family: "Cormorant Infant", serif;
    font-style: italic;
    font-size: 18px;
    font-weight: 500;
    vertical-align: 8px;
    margin: 0 6px;
    line-height: 1;
  }
  .hero-rule { width: 240px; height: 1px; background: var(--ink); opacity: 0.55; margin: 14px auto 12px; }
  .hero-sub {
    font-family: "Cormorant Garamond", serif;
    font-style: italic; font-weight: 400;
    color: var(--gold-deep);
    font-size: 18px;
    letter-spacing: 0.04em;
    margin: 0;
  }

  .quote {
    margin: 28px auto 0;
    max-width: 320px;
    color: var(--ink);
    font-family: "Quattrocento", serif;
    font-size: 13px;
    line-height: 1.5;
    position: relative;
    padding: 8px 0;
  }
  .quote-mark {
    color: var(--gold);
    font-family: "Cormorant Garamond", serif;
    font-size: 44px;
    line-height: 0.4;
    display: block;
    margin: 0 auto;
  }
  .quote-mark.top { margin-bottom: 10px; }
  .quote-mark.bottom { margin-top: 14px; transform: rotate(180deg); }

  /* ====== Countdown ====== */
  .countdown-title {
    font-family: "Cormorant Garamond", serif;
    font-weight: 400; font-size: 28px;
    color: var(--ink);
    margin: 0 0 14px;
  }
  .counters {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-items: end;
    gap: 0;
    max-width: 320px;
    margin: 0 auto;
    position: relative;
  }
  .counter {
    text-align: center;
    position: relative;
    animation: floatUp .8s ease forwards;
  }
  .counter:nth-child(1){animation-delay:.1s;}
  .counter:nth-child(2){animation-delay:.2s;}
  .counter:nth-child(3){animation-delay:.3s;}
  .counter:nth-child(4){animation-delay:.4s;}
  .counter + .counter::before {
    content: "";
    position: absolute;
    left: 0; top: 6px;
    width: 1px; height: 38px;
    background: var(--gold);
    opacity: 0.6;
  }
  .counter-num {
    font-family: "Cormorant Garamond", serif;
    font-weight: 400; font-size: 34px;
    line-height: 1;
    color: var(--gold-deep);
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }
  .counter-label {
    font-family: "Karla", sans-serif;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    margin-top: 3px;
  }
  .heart-pulse {
    margin: 16px auto 0;
    width: 34px;
    color: var(--gold);
    transform: scale(1);
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  /* El latido ya no es una animación infinita: JS añade/quita esta clase
     en cada cambio del contador de segundos, así el corazón late exactamente
     al ritmo real del countdown en vez de a un ritmo arbitrario. */
  .heart-pulse.beat { transform: scale(1.28); }

  /* ====== Invitados ====== */
  .badge-num {
    display: inline-grid; place-items: center;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--gold);
    color: #fff;
    font-family: "Cormorant Garamond", serif;
    font-size: 18px;
    line-height: 1;
    margin: 0 auto 14px;
  }
  .section-title {
    font-family: "Cormorant Garamond", serif;
    font-weight: 400; font-size: 28px;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .section-sub {
    font-family: "Karla", sans-serif;
    font-style: italic; font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }
  .guest-list {
    list-style: none; margin: 18px auto 0; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .guest-list li {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: var(--gold-deep);
    font-size: 16px;
    padding: 6px 22px;
    border-bottom: 1px solid rgba(213, 177, 94, 0.35);
    min-width: 200px;
  }
  .guest-foot {
    margin-top: 22px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: var(--gold-deep);
    font-size: 14px;
  }

  /* ====== Event cards ====== */
  .events {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 60px 22px 60px;
    background: var(--white);
  }
  .event-card {
    background: var(--card);
    border-radius: 10px;
    padding: 20px 14px 16px;
    text-align: center;
    box-shadow: var(--shadow-card);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform: translateY(0);
  }
  .event-card:hover { transform: translateY(-8px); box-shadow: 0 12px 28px rgba(60, 45, 20, 0.12); }
  .event-card-soft { background: var(--card-soft); }
  .event-card-soft:hover { transform: translateY(-8px); box-shadow: 0 12px 28px rgba(60, 45, 20, 0.12); }
  .event-icon { width: 54px; height: 54px; margin: 0 auto 14px; color: var(--gold); transition: transform 0.3s ease; }
  .event-card:hover .event-icon { transform: scale(1.1) rotate(5deg); }
  @keyframes iconPop {
    0% { transform: scale(0.5) rotate(-8deg); }
    55% { transform: scale(1.18) rotate(4deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .card-in .event-icon, .card-in .fiesta-icon { animation: iconPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .event-card h3 { font-family: "Cormorant Garamond", serif; font-weight: 400; font-size: 22px; color: var(--ink); margin: 0 0 8px; }
  .event-divider { display: block; width: 60px; height: 14px; margin: 0 auto 10px; opacity: 0.85; }
  .event-sub { font-family: "Cormorant Garamond", serif; font-weight: 500; font-style: italic; color: var(--ink); font-size: 16px; margin: 8px 0 3px; }
  .event-detail { font-family: "Karla", sans-serif; font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; line-height: 1.5; }

  /* ====== Pill button ====== */
  .btn-pill {
    display: inline-block;
    background: var(--gold);
    color: #fff;
    font-family: "Karla", sans-serif;
    font-weight: 500; font-size: 11px;
    letter-spacing: 0.08em;
    padding: 9px 22px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }
  .btn-pill:hover { background: var(--gold-deep); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(180, 147, 63, 0.3); }
  .btn-pill:active { transform: translateY(0); }
  .btn-pill.lg { font-size: 12px; padding: 11px 30px; }
  .btn-pill:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

  /* ====== Confirmación ====== */
  .confirm { padding: 32px 36px 36px; }
  .confirm .section-title { font-size: 26px; }
  .confirm .lead { font-family: "Cormorant Garamond", serif; font-style: italic; color: var(--gold-deep); font-size: 14px; margin: 0 0 22px; }

  /* ====== Gallery ====== */
  .gallery-wrap { padding: 0; text-align: center; }
  .camera-icon { width: 36px; height: 36px; color: var(--gold); margin: 0 auto 14px; display: block; animation: bounce 2s ease-in-out infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .carousel { position: relative; height: 300px; margin-bottom: 14px; }
  .carousel-track { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .slide {
    position: absolute;
    width: 270px; height: 195px;
    background: var(--card);
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 8px 22px rgba(40, 30, 10, 0.18);
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease, box-shadow 0.6s ease;
    cursor: pointer;
  }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dots { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  /* zona táctil real de 32px aunque el punto visible sea pequeño (evita mis-taps en móvil) */
  .dot {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    background: none; border: none; padding: 0; cursor: pointer;
  }
  .dot::after {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--card-deep);
    transition: background 0.25s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }
  .dot.active::after { background: var(--gold); transform: scale(1.5); }

  /* ====== Fiesta ====== */
  .fiesta-intro { text-align: center; }
  /* Card grande que envuelve título + las dos subcards de Tips/Alojamiento */
  .fiesta-outer-card { padding: 32px 26px 28px; background: var(--paper); }
  .fiesta-outer-card .fiesta-card { background: var(--white); }
  .fiesta-outer-card .section-title { font-size: 28px; margin-bottom: 6px; }
  .fiesta-outer-card .lead { font-family: "Cormorant Garamond", serif; font-style: italic; color: var(--gold-deep); font-size: 13px; margin: 0 auto; line-height: 1.4; max-width: 320px; }
  .fiesta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 22px 0 0; }
  .fiesta-card {
    background: var(--card);
    border-radius: 10px;
    padding: 20px 12px 20px;
    text-align: center;
    box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; align-items: center;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform: translateY(0);
  }
  .fiesta-card:hover { transform: translateY(-6px); box-shadow: 0 10px 24px rgba(60, 45, 20, 0.14); }
  .fiesta-card h4 { font-family: "Cormorant Garamond", serif; font-weight: 400; font-size: 16px; color: var(--ink); margin: 0 0 8px; }
  .fiesta-icon { width: 48px; height: 48px; color: var(--gold); margin: 4px auto 14px; transition: transform 0.3s ease; }
  .fiesta-card:hover .fiesta-icon { transform: scale(1.15); }
  .fiesta-card p { font-family: "Karla", sans-serif; font-size: 10px; color: var(--ink-soft); line-height: 1.4; margin: 0 0 8px; min-height: 28px; }
  .fiesta-card .btn-pill { font-size: 9.5px; padding: 7px 14px; }
  .fiesta-card.large { padding: 22px 18px; }
  .fiesta-card.large h4 { font-size: 18px; margin-bottom: 12px; }
  .fiesta-card.large p { font-size: 11px; min-height: 32px; }
  .fiesta-card.large .fiesta-icon { width: 56px; height: 56px; }


  /* ====== Footer ====== */
  .footer { padding: 56px 28px 36px; background: var(--white); display: grid; gap: 20px; align-items: start; text-align: left; }
  .footer-brand { text-align: left; }
  .footer-names { font-family: "Cormorant Infant", serif; font-weight: 500; font-size: 22px; color: var(--ink); line-height: 1.1; margin: 0; }
  .footer-names .amp { width: 20px; height: 20px; font-size: 14px; vertical-align: 4px; }
  .footer-rule { width: 130px; height: 1px; background: var(--ink); opacity: 0.55; margin: 8px 0 6px; }
  .footer-sub { font-family: "Cormorant Garamond", serif; font-style: italic; color: var(--gold-deep); font-size: 13px; margin: 0; }
  .footer-links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 14px; font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 14px; }
  .footer-links li + li { position: relative; padding-left: 14px; }
  .footer-links li + li::before { content: "·"; position: absolute; left: 0; color: var(--gold); }
  .footer-links a { color: var(--gold-deep); text-decoration: none; transition: color 0.15s; background: none; border: none; cursor: pointer; font: inherit; text-align: left; padding: 0; }
  .footer-links a:hover { color: var(--gold-deep); text-decoration: underline; }
  .credit { grid-column: 1 / -1; text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid #eee; font-family: "Karla", sans-serif; font-size: 11px; color: var(--ink-soft); }
  .credit .heart { color: var(--gold); }

  /* ====== Modal ====== */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(40, 30, 10, 0.55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    display: grid; place-items: center;
    z-index: 100;
    padding: 16px;
    padding-top: calc(16px + var(--safe-top));
    padding-bottom: calc(16px + var(--safe-bottom));
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--white);
    width: 420px; max-width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.32);
    padding: 36px 32px 32px;
    text-align: center;
    position: relative;
    transform: translateY(22px) scale(0.97);
    transition: transform 0.32s cubic-bezier(0.16, 0.9, 0.3, 1);
  }
  .modal-backdrop.open .modal { transform: translateY(0) scale(1); }
  .modal-close {
    position: absolute; top: 8px; right: 8px;
    background: none; border: none;
    color: var(--ink-soft);
    font-size: 22px; cursor: pointer;
    line-height: 1;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 50%;
    transition: background 0.15s ease;
  }
  .modal-close:hover { background: rgba(0,0,0,0.05); }
  .modal-icon { width: 90px; height: 90px; margin: 0 auto 12px; color: var(--gold); }
  .modal h3 { font-family: "Cormorant Garamond", serif; font-weight: 400; font-size: 24px; color: var(--ink); margin: 0 0 6px; }
  .modal .divider { display: block; margin: 6px auto 18px; width: 60px; height: 14px; opacity: 0.85; }
  .modal-field {
    display: block; width: 100%;
    padding: 11px 14px;
    border: 1px solid #ddd;
    border-radius: 3px;
    font-family: "Karla", sans-serif;
    font-size: 16px; /* >=16px evita el zoom automático de iOS Safari al enfocar */
    color: var(--ink);
    margin-bottom: 12px;
    background: #fafafa;
    outline: none;
  }
  .modal-field:focus { border-color: var(--gold); background: #fff; }
  .modal-row { display: flex; gap: 10px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
  .btn-pill.outline { background: transparent; color: var(--gold-deep); border: 1px solid var(--gold); }
  .btn-pill.outline:hover { background: var(--gold); color: #fff; }
  .btn-pill.outline.selected { background: var(--gold); color: #fff; }

  .modal-link { color: var(--gold-deep); text-decoration: none; font-weight: 600; position: relative; transition: color .25s ease; }
  .modal-link::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 100%; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: center; transition: transform .3s ease; }
  .modal-link:hover { color: var(--gold); }
  .modal-link:hover::after { transform: scaleX(1); }

  /* ====== Lightbox ====== */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 200; display: none; align-items: center; justify-content: center; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 86vh; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .lightbox .close { position: absolute; top: calc(18px + var(--safe-top)); right: 22px; color: #fff; background: none; border: none; font-size: 32px; cursor: pointer; }
  .lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 24px; }
  .lightbox .nav.prev { left: 16px; }
  .lightbox .nav.next { right: 16px; }

  .toast {
    position: fixed;
    left: 50%; bottom: calc(30px + var(--safe-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fff;
    padding: 11px 22px;
    border-radius: 999px;
    font-family: "Karla", sans-serif;
    font-size: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 300;
    pointer-events: none;
    max-width: calc(100vw - 40px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .field-error { color: #b4443f; font-size: 11px; font-family: "Karla", sans-serif; margin: -6px 0 10px; text-align: left; display: none; }
  .field-error.show { display: block; }
  .modal-field.invalid { border-color: #b4443f; }

  /* ====== Mobile Optimization — escala más grande e impactante ====== */
  @media (max-width: 480px) {
    .stage { padding: 0; }
    .top-ornament { width: 106px; height: 68px; margin: 0 auto 16px; }
    .top-ornament-lg { width: 124px; height: 84px; margin: 0 auto 20px; }
    .hero-pin { padding: calc(18px + var(--safe-top)) 20px 0px; }
    .hero-top-ornament { margin: 4px auto 44px; width: 215px; height: 66px; }
    body { font-size: 18px; }
    .hero-names { font-size: 56px; line-height: 1; }
    .amp { width: 33px !important; height: 33px !important; font-size: 21px !important; vertical-align: 9px !important; margin: 0 7px !important; }
    .hero-date { gap: 13px; margin-bottom: 6px; }
    .hero-date svg { width: 42px; height: 14px; }
    .hero-date span:nth-child(2) { font-size: 33px; }
    .hero-rule { width: 240px; margin: 14px auto 12px; }
    .hero-sub { font-size: 23px; }
    .quote { margin: 26px auto 0; font-size: 16px; padding: 8px 0; line-height: 1.55; max-width: 310px; }
    .quote-mark { font-size: 46px; }
    .quote-mark.top { margin-bottom: 6px; }
    .quote-mark.bottom { margin-top: 8px; }
    .wave { height: 10px; }
    section.block { padding: 26px 20px 30px; }
    .countdown-title { font-size: 34px; margin-bottom: 18px; }
    .counters { max-width: 320px; gap: 0; }
    .counter-num { font-size: 42px; }
    .counter-label { font-size: 13.5px; margin-top: 5px; }
    .heart-pulse { margin: 18px auto 0; width: 40px; }
    section.block[data-countdown] { padding-top: 18px !important; padding-bottom: 24px !important; }
    .event-card { padding: 26px 18px 22px; }
    .event-icon { width: 68px; height: 68px; margin-bottom: 12px; }
    .event-card h3 { font-size: 26px; line-height: 1.2; margin-bottom: 10px; }
    .event-divider { height: 15px; margin: 0 auto 12px; width: 64px; }
    .event-sub { font-size: 19px; margin: 10px 0 5px; }
    .event-detail { font-size: 14.5px; margin-bottom: 11px; line-height: 1.5; }
    .btn-pill { font-size: 14px; padding: 12px 22px; margin-bottom: 3px; }
    .btn-pill.lg { font-size: 16px; padding: 14px 30px; }
    .events { padding: 28px 14px 28px; gap: 14px; }
    .confirm { padding: 34px 20px 38px; }
    .confirm .section-title { font-size: 29px; letter-spacing: 0.01em; }
    .confirm .lead { font-size: 16px; margin-bottom: 22px; }
    .gallery-wrap { padding: 0; }
    .camera-icon { width: 42px; height: 42px; margin-bottom: 18px; }
    .carousel { height: 300px; margin-bottom: 14px; }
    .slide { width: 270px; height: 195px; }
    .dots { gap: 8px; margin-top: 8px; }
    .fiesta-outer-card { padding: 30px 18px 26px; }
    .fiesta-outer-card .section-title { font-size: 32px; margin-bottom: 11px; }
    .fiesta-outer-card .lead { font-size: 16px; }
    .fiesta-grid { grid-template-columns: repeat(2, 1fr); padding: 18px 0 0; gap: 16px; }
    .fiesta-card { padding: 20px 10px 20px; }
    .fiesta-card h4 { font-size: 19px; margin-bottom: 11px; }
    .fiesta-icon { width: 58px; height: 58px; margin: 2px auto 12px; }
    .fiesta-card p { font-size: 13px; margin-bottom: 11px; min-height: 24px; }
    .fiesta-card .btn-pill { font-size: 12.5px; padding: 9px 16px; }
    .fiesta-card.large { padding: 22px 14px; grid-column: 1 / -1; }
    .fiesta-card.large h4 { font-size: 21px; margin-bottom: 9px; }
    .fiesta-card.large p { font-size: 14px; min-height: 26px; }
    .fiesta-card.large .fiesta-icon { width: 64px; height: 64px; }
    .footer { padding: 30px 18px calc(22px + var(--safe-bottom)); gap: 14px; }
    .footer-names { font-size: 22px; }
    .footer-names .amp { width: 19px !important; height: 19px !important; font-size: 14px !important; vertical-align: 3px !important; }
    .footer-rule { width: 100px; margin: 8px 0 6px; }
    .footer-sub { font-size: 14px; }
    .footer-links { font-size: 14px; gap: 6px; }
    .footer-links a { font-size: 14px; }
    .credit { font-size: 12px; margin-top: 14px; padding-top: 12px; }
    .modal { width: calc(100vw - 24px); max-width: 100%; padding: 30px 22px 22px; }
    .modal h3 { font-size: 24px; margin-bottom: 6px; }
    .modal-sub { font-size: 13px; }
    .modal-icon { width: 78px; height: 78px; margin-bottom: 10px; }
    .modal .divider { margin: 6px auto 14px; }
    .modal-field { padding: 12px 14px; margin-bottom: 11px; }
    .modal-row { gap: 9px; flex-wrap: wrap; }
  }

  .confirm, .events, .fiesta-intro {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 18px;
    margin: 40px 12px;
  }
  /* La galería no lleva caja: solo el carrusel flotando sobre el fondo. */
  .gallery-wrap {
    position: relative;
    z-index: 2;
    margin: 40px 0;
  }

  /* spinner pequeño para el botón al enviar */
  .btn-spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,0.5);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* loader inicial sobre fondo paper, para que no se vea blanco en ningún momento */
  #boot-loader {
    position: fixed; inset: 0;
    background: var(--paper);
    display: flex; align-items: center; justify-content: center;
    z-index: 999;
    transition: opacity 0.5s ease;
  }
  #boot-loader.hide { opacity: 0; pointer-events: none; }
  #boot-loader .loader-heart {
    width: 46px; height: 46px;
    color: var(--gold);
    animation: loaderBeat 1s ease-in-out infinite;
  }
  @keyframes loaderBeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.18); }
    40% { transform: scale(0.96); }
    55% { transform: scale(1.1); }
  }

  /* La invitación entra con un leve deslizamiento desde arriba + fade cuando
     el loader termina, en vez de aparecer de golpe. */
  .invite { opacity: 0; transform: translateY(-16px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
  .invite.page-in { opacity: 1; transform: translateY(0); }

  noscript {
    display: block;
    text-align: center;
    padding: 40px 20px;
    font-family: "Karla", sans-serif;
  }
</style>
</head>
